<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0F19">
  <meta name="description" id="meta-description" content="">
  <meta name="author" id="meta-author" content="">
  <meta name="keywords" id="meta-keywords" content="">
  <title>Developer Links</title>
  <link rel="icon" id="favicon" href="">
  <style>
    :root {
      --bg:#0B0F19; --surface:#111827; --surface-hover:#182235;
      --text:#F9FAFB; --muted:#9CA3AF; --primary:#7C3AED;
      --primary-hover:#8B5CF6; --border:#263244; --success:#22C55E;
      --radius:18px; --button-radius:14px; --shadow:0 18px 50px rgba(0,0,0,.22);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg); background-attachment:fixed;
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; }
    .page { width:min(720px, calc(100% - 32px)); margin:0 auto; padding:48px 0 36px; }
    .topbar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:18px; }
    .icon-btn {
      width:42px; height:42px; border:1px solid var(--border); border-radius:12px;
      background:rgba(17,24,39,.72); color:var(--text); cursor:pointer;
      display:grid; place-items:center; transition:.2s ease;
    }
    .icon-btn:hover { background:var(--surface-hover); transform:translateY(-2px); }
    .profile { text-align:center; }
    .avatar {
      width:104px; height:104px; margin:0 auto 18px; border-radius:50%;
      display:grid; place-items:center; overflow:hidden; font-size:42px;
      background:linear-gradient(135deg,var(--primary),#06B6D4);
      border:4px solid rgba(255,255,255,.08); box-shadow:0 12px 40px rgba(0,0,0,.3);
    }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .name-row { display:flex; justify-content:center; align-items:center; gap:8px; }
    h1 { margin:0; font-size:clamp(28px,5vw,38px); letter-spacing:-.04em; }
    .verified { color:var(--primary-hover); font-size:18px; }
    .headline { margin:9px 0 0; font-size:17px; font-weight:650; }
    .bio { max-width:610px; margin:10px auto 0; color:var(--muted); line-height:1.65; }
    .meta { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:16px 0 0; }
    .pill { padding:7px 11px; border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:13px; }
    .availability { color:var(--success); border-color:rgba(34,197,94,.25); }
    .stats {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:24px 0 30px;
    }
    .stat { background:rgba(17,24,39,.72); border:1px solid var(--border); border-radius:14px; padding:13px 8px; }
    .stat strong { display:block; font-size:19px; }
    .stat span { color:var(--muted); font-size:12px; }
    section { margin-top:30px; }
    .section-title { font-size:14px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 12px 4px; }
    .links { display:grid; gap:12px; }
    .link-card {
      position:relative; display:flex; align-items:center; gap:14px; min-height:70px;
      padding:13px 16px; border:1px solid var(--border); border-radius:var(--button-radius);
      background:rgba(17,24,39,.84); box-shadow:0 8px 24px rgba(0,0,0,.08);
      transition:transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .link-card:hover { transform:translateY(-3px); background:var(--surface-hover); border-color:var(--primary); }
    .link-icon {
      flex:0 0 42px; width:42px; height:42px; border-radius:12px;
      display:grid; place-items:center; background:rgba(124,58,237,.13);
      font-weight:800; color:var(--text);
    }
    .link-content { min-width:0; flex:1; }
    .link-title { font-weight:700; font-size:15px; }
    .link-description { color:var(--muted); font-size:12.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .arrow { color:var(--muted); font-size:20px; transition:.2s; }
    .link-card:hover .arrow { color:var(--text); transform:translateX(3px); }
    .featured { border-color:rgba(124,58,237,.55); background:linear-gradient(100deg,rgba(124,58,237,.16),rgba(6,182,212,.07)); }
    .projects { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .project {
      border:1px solid var(--border); border-radius:16px; padding:18px; background:rgba(17,24,39,.84);
      transition:.2s ease;
    }
    .project:hover { transform:translateY(-3px); border-color:var(--primary); }
    .project-icon { font-size:25px; }
    .project h3 { margin:11px 0 6px; font-size:17px; }
    .project p { color:var(--muted); line-height:1.55; font-size:13px; margin:0 0 13px; }
    .techs { display:flex; flex-wrap:wrap; gap:6px; }
    .tech { font-size:11px; border:1px solid var(--border); color:var(--muted); padding:5px 7px; border-radius:8px; }
    .cta {
      padding:24px; text-align:center; border:1px solid var(--border); border-radius:18px;
      background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(6,182,212,.08));
    }
    .cta h2 { margin:0 0 7px; font-size:22px; }
    .cta p { color:var(--muted); margin:0 auto 16px; max-width:480px; line-height:1.55; }
    .cta a {
      display:inline-flex; align-items:center; justify-content:center; padding:11px 18px;
      border-radius:12px; background:var(--primary); font-weight:700;
    }
    .cta a:hover { background:var(--primary-hover); }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:28px 0 4px; }
    footer a { color:var(--text); }
    .toast {
      position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px);
      opacity:0; pointer-events:none; background:var(--surface); border:1px solid var(--border);
      padding:10px 14px; border-radius:10px; transition:.25s; font-size:13px;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:600px) {
      .page { padding-top:24px; }
      .stats { gap:7px; }
      .projects { grid-template-columns:1fr; }
      .link-card { min-height:66px; }
    }
    @media (prefers-reduced-motion:reduce) {
      * { scroll-behavior:auto !important; transition:none !important; }
    }
  </style>
</head>
<body>
<main class="page">
  <nav class="topbar" aria-label="Controles">
    <button class="icon-btn" id="shareBtn" title="Compartir perfil" aria-label="Compartir perfil">↗</button>
    <!--button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">☾</button-->
  </nav>

  <header class="profile">
    <div class="avatar" id="avatar" aria-hidden="true">💻</div>
    <div class="name-row">
      <h1 id="name"></h1><span id="verified" class="verified" hidden>✓</span>
    </div>
    <div class="headline" id="headline"></div>
    <p class="bio" id="bio"></p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div id="app"></div>

  <footer id="footer"></footer>
</main>
<div class="toast" id="toast"></div>

<script>
  const CONFIG_URL = "./config.json";

  const $ = (id) => document.getElementById(id);
  const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));

  function applyTheme(c) {
    const root = document.documentElement;
    const colors = c.theme.colors || {};
    Object.entries(colors).forEach(([key, value]) => {
      const cssKey = "--" + key.replace(/[A-Z]/g, m => "-" + m.toLowerCase());
      root.style.setProperty(cssKey, value);
    });
    if (c.theme.card) {
      root.style.setProperty("--radius", (c.theme.card.radius || 18) + "px");
      root.style.setProperty("--shadow", c.theme.card.shadow || "none");
    }
    if (c.theme.button) root.style.setProperty("--button-radius", (c.theme.button.radius || 14) + "px");
    if (c.theme.gradient?.enabled) {
      document.body.style.background = `linear-gradient(${c.theme.gradient.angle}deg, ${c.theme.gradient.from}18, transparent 35%), ${colors.background || "#0B0F19"}`;
    } else if (c.theme.background?.value) {
      document.body.style.background = c.theme.background.value;
    }
  }

  function renderProfile(c) {
    const p = c.profile || {};
    $("name").textContent = p.name || "";
    $("headline").textContent = p.headline || "";
    $("bio").textContent = p.bio || "";
    $("verified").hidden = !p.verified;

    const avatar = $("avatar");
    avatar.textContent = p.avatar ? "" : (c.site?.icon || "💻");
    if (p.avatar) {
      const img = document.createElement("img");
      img.src = p.avatar; img.alt = p.name || "Avatar";
      avatar.appendChild(img);
    }

    const meta = [];
    if (p.location) meta.push(`<span class="pill">📍 ${escapeHTML(p.location)}</span>`);
    if (p.availability) meta.push(`<span class="pill availability">● ${escapeHTML(p.availability)}</span>`);
    (p.tags || []).forEach(t => meta.push(`<span class="pill">${escapeHTML(t)}</span>`));
    $("meta").innerHTML = meta.join("");

    $("stats").innerHTML = (p.stats || []).map(s =>
      `<div class="stat"><strong>${escapeHTML(s.value)}</strong><span>${escapeHTML(s.label)}</span></div>`
    ).join("");
  }

  function renderLink(link) {
    if (link.enabled === false) return "";
    const featured = link.featured ? " featured" : "";
    return `
      <a class="link-card${featured}" href="${escapeHTML(link.url)}" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">${escapeHTML(link.icon || "↗")}</span>
        <span class="link-content">
          <span class="link-title">${escapeHTML(link.title)}</span>
          ${link.description ? `<span class="link-description">${escapeHTML(link.description)}</span>` : ""}
        </span>
        <span class="arrow">›</span>
      </a>`;
  }

  function renderSections(c) {
    const enabledSections = (c.sections || []).filter(s => s.enabled !== false);
    let html = "";

    enabledSections.forEach(section => {
      if (section.type === "links") {
        const links = (c.links || []).filter(l => l.enabled !== false);
        html += `<section id="${escapeHTML(section.id)}">
          <h2 class="section-title">${escapeHTML(section.title)}</h2>
          <div class="links">${links.map(renderLink).join("")}</div>
        </section>`;
      }

      if (section.type === "projects") {
        const projects = (c.projects || []).filter(p => p.enabled !== false);
        if (!projects.length) return;
        html += `<section id="${escapeHTML(section.id)}">
          <h2 class="section-title">${escapeHTML(section.title)}</h2>
          <div class="projects">${projects.map(p => `
            <a class="project" href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">
              <div class="project-icon">${escapeHTML(p.icon || "🚀")}</div>
              <h3>${escapeHTML(p.name)}</h3>
              <p>${escapeHTML(p.description)}</p>
              <div class="techs">${(p.tech || []).map(t => `<span class="tech">${escapeHTML(t)}</span>`).join("")}</div>
            </a>`).join("")}</div>
        </section>`;
      }

      if (section.type === "cta" && c.cta) {
        const x = c.cta;
        html += `<section id="${escapeHTML(section.id)}">
          <div class="cta">
            <h2>${escapeHTML(x.title)}</h2>
            <p>${escapeHTML(x.text)}</p>
            <a href="${escapeHTML(x.url)}"> ${escapeHTML(x.buttonText || "Contactar")} </a>
          </div>
        </section>`;
      }
    });
    $("app").innerHTML = html;
  }

  function renderFooter(c) {
    const f = c.footer || {};
    $("footer").innerHTML = `${escapeHTML(f.text || "")}${
      f.showGithubBadge && f.repository
        ? ` · <a href="${escapeHTML(f.repository)}" target="_blank" rel="noopener noreferrer">View source</a>`
        : ""
    }`;
  }

  function setupSEO(c) {
    document.title = c.site?.title || "Developer Links";
    $("meta-description").content = c.site?.description || "";
    $("meta-author").content = c.seo?.author || c.profile?.name || "";
    $("meta-keywords").content = (c.seo?.keywords || []).join(", ");
    if (c.site?.favicon) $("favicon").href = c.site.favicon;
  }

  function showToast(text) {
    const toast = $("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  async function loadConfig() {
    try {
      const response = await fetch(CONFIG_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("No se pudo cargar config.json");
      const c = await response.json();

      applyTheme(c);
      renderProfile(c);
      renderSections(c);
      renderFooter(c);
      setupSEO(c);

      $("shareBtn").addEventListener("click", async () => {
        try {
          if (navigator.share) {
            await navigator.share({ title: c.site?.title, text: c.profile?.bio, url: location.href });
          } else {
            await navigator.clipboard.writeText(location.href);
            showToast("Enlace copiado");
          }
        } catch (_) {}
      });

      $("themeBtn").addEventListener("click", () => {
        const light = document.body.dataset.theme === "light";
        document.body.dataset.theme = light ? "dark" : "light";
        if (!light) {
          document.documentElement.style.setProperty("--bg", "#F8FAFC");
          document.documentElement.style.setProperty("--surface", "#FFFFFF");
          document.documentElement.style.setProperty("--surface-hover", "#F1F5F9");
          document.documentElement.style.setProperty("--text", "#0F172A");
          document.documentElement.style.setProperty("--muted", "#64748B");
          document.documentElement.style.setProperty("--border", "#E2E8F0");
          $("themeBtn").textContent = "☀";
        } else {
          applyTheme(c);
          $("themeBtn").textContent = "☾";
        }
      });
    } catch (error) {
      $("app").innerHTML = `<section><div class="cta"><h2>Error cargando configuración</h2><p>${escapeHTML(error.message)}. Verifica que <strong>config.json</strong> esté en la misma carpeta que index.html.</p></div></section>`;
    }
  }

  loadConfig();
</script>
</body>
</html>
